<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Document</title>
    </head>
    <body>
        <h1>これはh1タグの見出しです</h1>
        <h2>これはh2タグの見出しです</h2>
        <h3>これはh3タグの見出しです</h3>
        <h4>これはh4タグの見出しです</h4>
        <h5>これはh5タグの見出しです</h5>
        <h6>これはh6タグの見出しです</h6>
        こっちはbrタグを使った改行をしています。<br>
        うまく表示できていそう
        <p>こっちはpタグを使った段落です。</p>

        <p><b>ボールド</b></p>
        <p><i>イタリック</i></p>
        <p><u>アンダーライン</u></p>
        <p><s>取り消し線</s></p>
        <p><strong>強調</strong></p>
        <p><em>強調</em></p>
        <p><mark>マーク</mark></p>
        <p><small>小さい文字</small></p>
        <p><del>削除</del></p>
        <p><ins>挿入</ins></p>
        <p>あ<sub>下付き文字</sub></p>
        <p>あ<sup>上付き文字</sup></p>
        <p>あ<code>コード</code></p>
        <p><pre>整形済みテキスト</pre></p>
        <p>あ<blockquote>引用</blockquote></p>
        <p><a href="https://www.google.com/">リンク</a></p>

    </body>
</html>
